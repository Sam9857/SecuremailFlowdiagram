<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mail-Trace – How It Works</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#070b14;--cd:#0e1626;--c2:#131e33;--ln:#22314f;--tx:#e8eef8;--mu:#93a6c6;--ac:#22d3ee;--ok:#34d399;--rd:#f0524f;--or:#f59a3c;--am:#f2cc3d;--pu:#a78bfa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
header{padding:22px 48px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}header b{font-size:20px}header span{color:var(--mu);font-size:14px}
#stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 48px 24px;max-width:1280px;width:100%;margin:auto}
.sc{animation:in .6s both}@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1}}
.kick{color:var(--ac);letter-spacing:.16em;font-size:14px;margin:0 0 10px}h1{font-size:44px;line-height:1.15;margin:0 0 14px}.msg{font-size:24px;color:var(--tx);max-width:820px;margin:0 0 36px}.msg em{color:var(--mu);font-style:normal}
.row{display:flex;align-items:center;justify-content:center;gap:0;flex-wrap:nowrap}.node{min-width:150px;text-align:center;padding:22px 20px;background:var(--cd);border:1px solid var(--ln);border-radius:14px;font-weight:700}
.node small{display:block;color:var(--mu);font-weight:400;font-size:14px}.ic{width:34px;height:34px;stroke:var(--ac);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pipe{position:relative;height:3px;flex:1;min-width:90px;background:var(--ln);border-radius:2px;overflow:visible}.pipe i{position:absolute;top:-4px;width:11px;height:11px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:mv 2.2s linear infinite}.pipe i:nth-child(2){animation-delay:1.1s}@keyframes mv{from{left:0}to{left:100%}}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}.chip{padding:8px 18px;border-radius:30px;border:1px solid var(--c,var(--ln));color:var(--c,var(--tx));background:var(--c2);font-size:16px;animation:pop .5s both}@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1}}
.warn{--c:var(--or)}.bad{--c:var(--rd)}.good{--c:var(--ok)}.pulse{animation:pop .5s both,pl 1.6s 1s infinite}@keyframes pl{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 25%,transparent)}}
.pk{font-family:Consolas,monospace;font-size:12px;color:var(--mu);background:var(--c2);border:1px solid var(--ln);border-radius:10px;padding:14px 18px;line-height:1.6;opacity:.8}
.lane{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;margin-top:6px}
.st{padding:22px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--cd);text-align:center;cursor:pointer;opacity:.4;transition:.5s;position:relative}
.st h4{margin:10px 0 6px;font-size:15px;line-height:1.3}.st p{margin:0;color:var(--mu);font-size:13px;line-height:1.4}
.st.d{opacity:.75}.st.a{opacity:1;border-color:var(--ac);transform:translateY(-6px);box-shadow:0 0 28px -8px var(--ac)}.st .n{position:absolute;top:8px;left:12px;font-size:12px;color:var(--mu)}
.dt{margin-top:34px;min-height:150px;text-align:center}.dt .big{font-size:76px;font-weight:800;color:var(--am);line-height:1}
.lock{animation:lk 1.6s ease-in-out infinite}@keyframes lk{50%{transform:translateY(-3px)}}
.ai{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pu);margin:0 3px;animation:ai 1s infinite}.ai:nth-child(2){animation-delay:.2s}.ai:nth-child(3){animation-delay:.4s}@keyframes ai{50%{transform:scale(1.7);opacity:.5}}
footer{padding:16px 48px 28px;display:flex;flex-direction:column;gap:16px;align-items:center}.dots{display:flex;gap:10px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--ln);cursor:pointer;transition:.3s}.dots i.on{background:var(--ac);transform:scale(1.4)}
button{background:var(--c2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:11px 20px;font-size:15px;cursor:pointer}button.p{background:var(--ac);color:#04101c;font-weight:700;border:0}
#md{position:fixed;inset:0;background:rgba(3,6,12,.75);display:none;align-items:center;justify-content:center;z-index:9}#md.o{display:flex}#md div{background:var(--cd);border:1px solid var(--ac);border-radius:14px;padding:32px;max-width:520px;margin:20px}
.note{color:var(--mu);font-size:14px;margin-top:28px}
@media (max-width:980px){.lane{grid-template-columns:repeat(2,1fr)}.row{flex-wrap:wrap;gap:16px}.pipe{min-width:40px}h1{font-size:32px}#stage,header,footer{padding-left:20px;padding-right:20px}}
</style></head><body>
<header><b>Mail-Trace/b><span>How it works · Passive PCAP Forensics · Demo visual (synthetic example)</span></header>
<div id="stage"></div>
<footer><div class="dots" id="dots"></div><div><button onclick="step(-1)">◀ Back</button> <button class="p" id="pp" onclick="toggle()">Pause</button> <button onclick="restart()">Restart</button> <button onclick="step(1)">Explore Step ▶</button></div></footer>
<div id="md" onclick="this.classList.remove('o')"><div id="mc"></div></div>
<script>
const IC={up:'M12 16V4M7 9l5-5 5 5M4 20h16',st:'M3 6h18M3 12h14M3 18h18',ml:'M3 6h18v12H3zM3 7l9 7 9-7',lk:'M6 11h12v9H6zM8 11V8a4 4 0 018 0v3',ce:'M5 4h14v12H5zM9 20l3-3 3 3M8 8h8M8 12h5',rk:'M12 3l9 16H3zM12 10v4M12 17v.5',ga:'M4 17a8 8 0 1116 0M12 17l4-6',us:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0',sv:'M4 5h16v5H4zM4 14h16v5H4zM8 7.5h.5M8 16.5h.5'};
const ic=k=>`<svg class="ic" viewBox="0 0 24 24"><path d="${IC[k]}"/></svg>`;
const ST=[['up','Upload & Verify','Secure the evidence.',['PCAP','SHA-256'],'The analyst uploads a .pcap/.pcapng file. A SHA-256 fingerprint is created so the evidence can be proven unchanged.'],
['st','Rebuild Communication','Reconstruct complete conversations.',['TCP streams'],'Packets are put back in the right order and grouped into conversations (TCP streams).'],
['ml','Understand Email Traffic','Understand how email traffic uses encryption.',['SMTP','IMAP','POP3','STARTTLS / STLS'],'The system recognises SMTP, IMAP and POP3 and follows the upgrade from plaintext to TLS.'],
['lk','Analyze TLS','Check how the secure connection was negotiated.',['ClientHello','ServerHello','Cipher','Key Exchange'],'Reads the TLS handshake: version, cipher suite, key exchange and forward secrecy.'],
['ce','Check Certificates','Check certificate security.',['X.509','Expiry','Hostname','Key','Signature','Chain'],'Certificates are checked when visible. TLS 1.3 encrypts the certificate, so it may not be visible in a passive capture.'],
['rk','Find & Prioritize Risk','Find problems and prioritize risk.',['Weak TLS','Weak Cipher','Bad Certificate','STARTTLS Issue','Anomaly'],'Rules provide the evidence. AI helps prioritize risk and spot unusual sessions. AI does not replace the rules.'],
['ga','Security Posture','A clear score with evidence.',['58 / 100'],'One 0–100 score, findings ranked by severity, packet-level evidence, recommendations and reports.']];
const BEATS=[{t:'The problem',f:s=>`<div class="sc"><p class="kick">THE PROBLEM</p><h1>Email is everywhere.</h1><p class="msg">People send and read email every day.</p><div class="row"><div class="node">${ic('us')}<small>User</small></div><div class="pipe"><i></i><i></i></div><div class="node">${ic('sv')}<small>Email Server</small></div></div><div class="chips">${['SMTP','IMAP','POP3'].map((c,i)=>`<span class="chip" style="animation-delay:${i*.3}s">${c}</span>`).join('')}</div></div>`},
{t:'Hidden risks',f:s=>`<div class="sc"><p class="kick">THE PROBLEM</p><h1>TLS is not always enough.</h1><p class="msg">Email may use TLS, but incorrect cryptographic configuration can still create security risks.</p><div class="chips" style="margin-top:0">${['TLS 1.0','Weak Cipher','Expired Certificate','STARTTLS Problem','No Forward Secrecy','Plaintext Authentication'].map((c,i)=>`<span class="chip ${i%2?'warn':'bad'} pulse" style="animation-delay:${i*.25}s">${c}</span>`).join('')}</div></div>`},
{t:'Existing tools',f:s=>`<div class="sc"><p class="kick">WHY EXISTING TOOLS ARE NOT ENOUGH</p><h1>Packets are visible.</h1><p class="msg"><em>But overall cryptographic risk is still difficult to understand.</em></p><div class="row"><div class="node">${ic('up')}<small>PCAP</small></div><div class="pipe"><i></i></div><div class="node">Wireshark<small>Lots of packets</small></div><div class="pipe"><i></i></div><div class="pk">0x16 03 03 00 7a 01 00…<br>0x16 03 01 02 00 0b 00…<br>EHLO · STARTTLS · 220…<br>…thousands more rows</div></div><div class="chips">${['Manual Analysis','Manual Investigation','Manual Prioritization'].map((c,i)=>`<span class="chip warn" style="animation-delay:${.6+i*.3}s">${c}</span>`).join('')}<span class="chip bad pulse" style="animation-delay:1.6s">TIME CONSUMING</span></div></div>`},
{t:'PCAP enters',f:s=>`<div class="sc" style="text-align:center"><p class="kick">THE SOLUTION</p><h1>SecureMailScope</h1><p class="msg" style="margin:0 auto 36px">Upload a capture. Get a clear answer.</p><div class="row"><div class="node">${ic('up')}<small>capture.pcap</small></div><div class="pipe"><i></i><i></i></div><div class="node" style="border-color:var(--ac);box-shadow:0 0 36px -8px var(--ac);padding:34px 40px;font-size:24px">SecureMailScope<small>Passive PCAP Forensics</small></div></div></div>`},
...ST.map((x,i)=>({t:x[1],stage:i})),
{t:'Final',f:s=>`<div class="sc" style="text-align:center"><p class="kick">SECUREMAILSCOPE</p><h1>From captured packets<br>to actionable email security intelligence.</h1><div class="row" style="margin-top:44px">${['PCAP','Analysis','Risk','Evidence','Recommendation','Report'].map((c,i)=>`${i?'<div class="pipe" style="min-width:40px"><i></i></div>':''}<div class="node" style="min-width:0;padding:16px 18px;animation:pop .5s ${i*.3}s both">${c}</div>`).join('')}</div><p class="note">Passive analysis of an uploaded capture. Not live monitoring. Example values are synthetic.</p></div>`}];
let b=0,play=true,tm=null;
function laneHTML(a){return `<div class="sc"><p class="kick">STAGE ${a+1} OF 7 · HOW IT WORKS</p><div class="lane">${ST.map((s,i)=>`<div class="st ${i<a?'d':i==a?'a':''}" onclick="info(${i})"><span class="n">${i+1}</span>${ic(s[0])}<h4>${s[1]}</h4><p>${s[2]}</p></div>`).join('')}</div><div class="dt" id="dt"></div><p class="note" style="text-align:center">Click a stage for more detail.</p></div>`}
function detail(a){const d=$('#dt');if(!d)return;const s=ST[a];let h=`<div class="chips" style="justify-content:center;margin-top:0">${s[3].map((c,i)=>a==6?'':`<span class="chip ${a==5&&i>3?'pulse bad':''}" style="animation-delay:${i*.25}s">${c}</span>`).join('')}</div>`;
 if(a==0)h+='<p class="msg" style="margin:20px auto 0;font-size:20px">Analyzing captured traffic…</p>';
 if(a==3)h+=`<p class="lock" style="margin-top:14px">${ic('lk')}</p>`;
 if(a==4)h+=`<p style="color:var(--ok);margin-top:14px">✓ Certificate verification</p>`;
 if(a==5)h+=`<p style="margin-top:20px"><span class="ai"></span><span class="ai"></span><span class="ai"></span><br><span style="color:var(--mu);font-size:15px">Rules provide evidence. AI helps prioritize risk.</span></p>`;
 if(a==6){h=`<div class="big" id="sc">0</div><div style="color:var(--am);font-size:20px;margin:6px 0 16px">Needs Improvement</div><div class="chips" style="justify-content:center;margin-top:0">${['Critical','High','Medium','Low'].map((c,i)=>`<span class="chip" style="animation-delay:${i*.2}s;--c:${['#f0524f','#f59a3c','#f2cc3d','#38bdf8'][i]}">${c}</span>`).join('')}${['Evidence','Recommendations','Reports'].map((c,i)=>`<span class="chip good" style="animation-delay:${1+i*.3}s">${c}</span>`).join('')}</div>`;d.innerHTML=h;const e=$('#sc'),t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1300);e.textContent=Math.round(58*p);if(p<1)requestAnimationFrame(f)})(t0);return}
 d.innerHTML=h}
const $=s=>document.querySelector(s);
function show(){clearTimeout(tm);const B=BEATS[b];$('#stage').innerHTML=B.stage!==undefined?laneHTML(B.stage):B.f();if(B.stage!==undefined)detail(B.stage);
 $('#dots').innerHTML=BEATS.map((x,i)=>`<i class="${i==b?'on':''}" title="${x.t}" onclick="b=${i};show()"></i>`).join('');$('#pp').textContent=play?'Pause':'Play';
 if(play&&b<BEATS.length-1)tm=setTimeout(()=>{b++;show()},b<4||b==BEATS.length-1?4200:3800)}
function step(n){b=Math.max(0,Math.min(BEATS.length-1,b+n));show()}
function toggle(){play=!play;if(play&&b==BEATS.length-1)b=0;show()}
function restart(){b=0;play=true;show()}
function info(i){const s=ST[i];$('#mc').innerHTML=`<p class="kick">STAGE ${i+1}</p><h2 style="margin:0 0 10px">${s[1]}</h2><p style="color:var(--mu)">${s[4]}</p><p style="font-size:13px;color:var(--mu)">Click anywhere to close.</p>`;$('#md').classList.add('o')}
show();
</script></body></html>
